# kube-prometheus-stack values for the demo environment (namespace: monitoring).
# Tuned for fast alerting on a laptop, not for production.

# Short, stable resource names: kps-prometheus, kps-alertmanager, ...
fullnameOverride: kps

grafana:
  enabled: false # the Makefile turns it on; `make observability GRAFANA=0` leaves it off
  # Local only: Grafana is reachable solely through `make port-forward`, so
  # anonymous admin access avoids a login step without exposing anything.
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Admin
    auth:
      disable_login_form: true
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.logging.svc.cluster.local:3100
  # Grafana 13 peaks around 250Mi while starting (migrations, plugin load);
  # a 256Mi limit OOMKilled it in a loop.
  resources:
    requests: { cpu: 20m, memory: 256Mi }
    limits: { memory: 512Mi }

# Control-plane components are not reachable for scraping in kind; their
# jobs and rules would only produce noise alerts.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  create: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
    windows: false
    # Workload alerts come from deploy/observability/alerts.yaml so the demo
    # controls exactly which symptoms fire.
    kubernetesApps: false
  disabled:
    # Docker Desktop's VM does not expose NTP sync state to node-exporter,
    # so this fires permanently in kind.
    NodeClockNotSynchronising: true

prometheus:
  prometheusSpec:
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 2d
    # Pick up ServiceMonitors, PodMonitors, and PrometheusRules from every
    # namespace, not only those labelled with the Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
    # Mounted at /etc/alertmanager/secrets/incident-copilot-webhook/; the
    # Makefile creates it.
    secrets: [incident-copilot-webhook]
  # The shipped route, deploy/alertmanager/incident-copilot.yaml; keep the two
  # in step. The URL is the Control plane's NodePort in ic-control-plane, by
  # its node's container name on kind's Docker network.
  config:
    route:
      receiver: incident-copilot
      group_by: ['...']
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 5m
      routes:
        # Always firing by design; they name no workload.
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
    receivers:
      - name: "null"
      - name: incident-copilot
        webhook_configs:
          - url: http://ic-control-plane-control-plane:30080/webhook/alertmanager
            send_resolved: true
            max_alerts: 0
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/incident-copilot-webhook/token
